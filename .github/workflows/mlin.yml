name: Build Eden Pause Edition

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # Checkout
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # Clone Eden
      # ==============================
      - name: Clone Eden
        run: |
          git clone --recursive https://github.com/eden-emulator/mirror.git eden
          cd eden
          git checkout 37fe911952
          git submodule update --init --recursive


      # ==============================
      # Java
      # ==============================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==============================
      # Android SDK
      # ==============================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==============================
      # Gradle
      # ==============================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'


      # ==============================
      # Android dependencies
      # ==============================
      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"


      # ==============================
      # Add Pause Button
      # ==============================
      - name: Add Pause Button
        working-directory: eden
        run: |

          mkdir -p src/android/app/src/main/res/drawable


          # --------------------------------
          # Button background
          # --------------------------------

          cat > src/android/app/src/main/res/drawable/pause_button_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">

              <solid android:color="#CC202124"/>

              <stroke
                  android:width="2dp"
                  android:color="#FFFFFFFF"/>

              <size
                  android:width="58dp"
                  android:height="58dp"/>

          </shape>
          EOF


          # --------------------------------
          # Modify files
          # --------------------------------

          python3 <<'PY'

          from pathlib import Path


          # ==========================================
          # activity_emulation.xml
          # ==========================================

          layout = Path(
              "src/android/app/src/main/res/layout/activity_emulation.xml"
          )

          layout.write_text(r'''<?xml version="1.0" encoding="utf-8"?>

          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <androidx.fragment.app.FragmentContainerView
                  android:id="@+id/fragment_container"
                  android:name="androidx.navigation.fragment.NavHostFragment"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:keepScreenOn="true"
                  app:defaultNavHost="true" />

              <TextView
                  android:id="@+id/pause_button"
                  android:layout_width="58dp"
                  android:layout_height="58dp"
                  android:layout_gravity="top|end"
                  android:layout_marginTop="120dp"
                  android:layout_marginEnd="18dp"
                  android:background="@drawable/pause_button_background"
                  android:clickable="true"
                  android:focusable="true"
                  android:gravity="center"
                  android:text="⏸"
                  android:textColor="#FFFFFF"
                  android:textSize="25sp"
                  android:elevation="20dp" />

          </FrameLayout>
          ''')


          # ==========================================
          # EmulationActivity.kt
          # ==========================================

          activity = Path(
              "src/android/app/src/main/java/"
              "org/yuzu/yuzu_emu/activities/EmulationActivity.kt"
          )

          text = activity.read_text()


          # Find the exact existing line
          marker = "setContentView(binding.root)"

          count = text.count(marker)

          if count != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly 1 "
                  f"setContentView(binding.root), found {count}"
              )


          # Code to insert immediately after it
          insert = '''

          val pauseButton = findViewById<android.widget.TextView>(
              R.id.pause_button
          )

          pauseButton.setOnClickListener {
              if (NativeLibrary.isPaused()) {
                  NativeLibrary.unpauseEmulation()
                  pauseButton.text = "⏸"
              } else {
                  NativeLibrary.pauseEmulation()
                  pauseButton.text = "▶"
              }
          }
          '''


          text = text.replace(
              marker,
              marker + insert,
              1
          )


          activity.write_text(text)

          print("======================================")
          print("Pause button added successfully!")
          print("======================================")

          PY


      # ==============================
      # Build Eden
      # ==============================
      - name: Build Eden Optimized
        working-directory: eden
        run: |

          chmod +x src/android/gradlew
          chmod +x .ci/android/build.sh

          .ci/android/build.sh \
            --target optimized \
            --build-type Release


      # ==============================
      # Find APK
      # ==============================
      - name: Find APK
        working-directory: eden
        run: |

          echo "=============================="
          echo "APK FILES"
          echo "=============================="

          find artifacts \
            -type f \
            -name "*.apk" \
            -print


      # ==============================
      # Upload APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Optimized-Pause
          path: eden/artifacts/*.apk
          if-no-files-found: error
